server.port=8080

app.token.secret=${APP_TOKEN_SECRET:replace-with-a-long-random-secret}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:19006}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fittreino}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:eduardo1}

# Otimizações de pool de conexão para instâncias pequenas (Render)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Inicialização sob demanda para acelerar o boot drasticamente
spring.main.lazy-initialization=true

spring.jackson.default-property-inclusion=non_null