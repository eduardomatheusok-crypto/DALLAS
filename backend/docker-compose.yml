version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: fittreino-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fittreino
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fittreino_pgdata:/var/lib/postgresql/data

volumes:
  fittreino_pgdata:
