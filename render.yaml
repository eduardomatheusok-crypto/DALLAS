# Blueprint do Render para a API DALLAS.
# 1. Crie o banco (Neon) e copie a JDBC URL:
#    jdbc:postgresql://<host>.neon.tech:5432/<db>?sslmode=require
# 2. Em "env vars", preencha DB_URL, DB_USERNAME, DB_PASSWORD, APP_TOKEN_SECRET
#    e CORS_ALLOWED_ORIGINS (dashboard tem prioridade sobre estes valores).
services:
  - type: web
    name: dallas-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_TOKEN_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"