# Blueprint do Render para a API DALLAS.
# 1. Crie o banco (Supabase) e copie a JDBC URL:
#    jdbc:postgresql://<host>.supabase.co:6543/postgres?sslmode=require
# 2. Em "env vars", preencha DB_URL, DB_USERNAME, DB_PASSWORD e APP_TOKEN_SECRET.
services:
  - type: web
    name: dallas-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    buildCommand: cd backend && ./mvnw -q -DskipTests package
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_TOKEN_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://dallas-app.vercel.app